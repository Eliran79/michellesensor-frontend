name: CI/CD

# This repo holds a prebuilt Vite/React bundle (index.html + assets/).
# CI checks it and publishes it to GitHub Pages; there is no build step.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check index.html references existing files
        run: node scripts/check-links.mjs

      - name: Check JavaScript bundles parse
        run: |
          for f in assets/*.js; do
            cp "$f" "$RUNNER_TEMP/bundle.mjs"
            node --check "$RUNNER_TEMP/bundle.mjs" || { echo "::error file=$f::JavaScript bundle failed to parse"; exit 1; }
          done

      - name: Prepare site folder
        run: |
          mkdir -p _site
          cp -r index.html assets _site/
          touch _site/.nojekyll
          # GitHub Pages serves this repo under /<repo-name>/, so the bundle's
          # root paths ("/assets/...") become relative. Source stays unchanged.
          sed -i -E 's#(href|src)="/assets/#\1="./assets/#g' _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    # Deploy only from main, never from pull requests.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
